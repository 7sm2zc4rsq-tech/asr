<style>
:root{
--bg: #0a0f1c;
--card: rgba(20, 30, 60, 0.6);

justify-content:center;

body{
margin:0;
font-family:'Orbitron', sans-serif;
color:var(--text);

background:
radial-gradient(circle at 20% 20%, rgba(0,120,255,0.15), transparent 40%),

font-family:'Anton',sans-serif;

.menu button{
display:block;

transform:scale(0.95);

0 0 5px rgba(255,100,0,0.8),

.box{
background:var(--card);

border-radius:20px;

margin:12px;

box-shadow:0 8px 30px rgba(0,0,0,0.4);

}

padding:10px;
margin:6px;

transition:0.2s;

border-color:var(--accent);

}

#wheel{
width:260px;height:260px;
border-radius:50%;

}

#pointer{
width:0;
height:0;
border-left:15px solid transparent;
border-right:15px solid transparent;
border-bottom:30px solid white;
margin:auto;
}
#wheel{
position:relative;
}  
.playerBox{
cursor:pointer;
transition:0.2s;
}

.playerBox:hover{
background:rgba(255,100,0,0.3);
transform:scale(1.05);
box-shadow:0 0 15px orange;
}  
h3{
color:var(--text);
font-weight:600;
}
button{
background:linear-gradient(135deg, #0070f3, #00aaff);
border:none;
border-radius:12px;
padding:10px 18px;

color:white;
font-weight:600;

box-shadow:0 0 10px rgba(0,120,255,0.5);

transition:0.2s;
}

button:hover{
box-shadow:
0 0 20px rgba(0,140,255,0.9),
0 0 40px rgba(0,140,255,0.6);
}

button:active{
transform:scale(0.95);
}
.homeGrid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
gap:20px;
padding:10px;
}

.homeCard{
background:rgba(10,20,40,0.8);
border-radius:20px;
padding:20px;

border:1px solid rgba(0,120,255,0.2);

box-shadow:
0 0 10px rgba(0,120,255,0.2),
0 0 30px rgba(0,120,255,0.1);

transition:0.25s;
}

.homeCard:hover{
transform:scale(1.06);

box-shadow:
0 0 20px rgba(0,140,255,0.6),
0 0 40px rgba(0,140,255,0.4);
}
.titleMain{
font-family: 'Audiowide', sans-serif;
font-size:60px;
letter-spacing:4px;
color:#00eaff;

text-shadow:
0 0 10px #00eaff,
0 0 25px #008cff,
0 0 50px rgba(0,140,255,0.8);
}
@keyframes titleIntro{
0%{
opacity:0;
transform:translateY(-20px) scale(0.95);
filter:blur(8px);
}
100%{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}
animation:titleIntro 1s ease-out;
}
position:relative;
.titleMain::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.3),
transparent
);

animation:shine 3s infinite;
}

@keyframes shine{
0%{left:-100%;}
100%{left:100%;}
}  
</style>

</head>

<div id="popup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

">

  <div style="
background:rgba(255,255,255,0.06);

border:1px solid var(--border);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
  ">

    <h2>AGGIUNGI</h2>

    <input id="popupName" placeholder="Nome"><br><br>
    <input id="popupPoints" placeholder="Punti"><br><br>

    <button onclick="confirmAdd()">SALVA</button>
    <button onclick="closePopup()">CHIUDI</button>

  </div>
</div>  
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=firebase.firestore();

let games=["UNO","31","Saltacavallo","Fr0c10","Dubito","Las Vegas"];
let selected=[];
let currentType="";
let currentGame="";  
let unoScores = {};

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="ranking")loadRanking();
if(id==="palmares")loadPalmares();
if(id==="games")loadGames();
if(id==="tournament")loadSelect();
}

/* GIOCATORI */
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box playerBox" onclick="openPlayer('${d.data().name}')">
${d.data().name}
<button onclick="event.stopPropagation(); editPlayer('${d.id}','${d.data().name}')">✏️</button>

<button onclick="event.stopPropagation(); deleteDoc('players','${d.id}')">❌</button></div>`;
});
playersList.innerHTML=html;
}

async function editPlayer(id,n){
let nuovo=prompt("Nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}
async function openPlayer(name){

show("playerPage");

document.getElementById("playerTitle").innerHTML = "👤 " + name;

/* PALMARES */
let palmaresSnap = await db.collection("palmares").get();
let wins = 0;

palmaresSnap.forEach(d=>{
if(d.data().name === name) wins++;
});

/* PUNTI TOTALI */
let rankingSnap = await db.collection("ranking").get();
let totalPoints = 0;

rankingSnap.forEach(d=>{
if(d.data().name === name){
totalPoints += d.data().points;
}
});

/* PUNTI PER GIOCO */
let gameSnap = await db.collection("gameRanking").get();
let gameStats = {};
let tournaments = new Set(); // per evitare doppioni  

gameSnap.forEach(d=>{
if(d.data().player === name){

let g = d.data().game;
let pts = d.data().points;

/* punti */
if(!gameStats[g]) gameStats[g]=0;
gameStats[g]+=pts;

/* presenze */
if(d.data().tournament){
tournaments.add(d.data().tournament);
}

}
});

/* HTML */
let html = `
<div class="box">🏆 Titoli vinti: ${wins}</div>
<div class="box">⭐ Punti totali: ${totalPoints}</div>
<div class="box">🎯 Presenze torneo: ${tournaments.size}</div>
`;

html += `<div class="box"><h3>🎮 Per gioco</h3>`;

for(let g in gameStats){
html += `${g}: ${gameStats[g]}<br>`;
}

html += `</div>`;

document.getElementById("playerStats").innerHTML = html;

}  

/* DELETE */
async function deleteDoc(col,id){
await db.collection(col).doc(id).delete();
show(col);
}

/* TORNEO */
async function loadSelect(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<input type="checkbox" value="${d.id}" data-name="${d.data().name}" onchange="toggle(this)"> ${d.data().name}<br>`;
});
selectPlayers.innerHTML=html;
}

function toggle(e){

let id = e.value;
let name = e.dataset.name;

if(e.checked){
selected.push({id:id, name:name});
}else{
selected = selected.filter(p=>p.id !== id);
}

}

function startGames(){
let html="";
games.forEach(g=>{

html+=`<h3>${g}</h3>`;

selected.forEach(p=>{
html+=`${p.name}
<input id="${g}_${p.id}" value="0" oninput="updateLiveRanking()"><br>`;
});

/* 🔥 SOLO DOPO UNO aggiungo la tabella extra */
if(g === "UNO"){
html += `<div id="unoExtra"></div>`;
}  

});
html+=`
<div id="liveRanking"></div>

<button onclick="finish()">Fine Torneo</button>
`;
gamesArea.innerHTML=html;
createUnoExtra();
}  
function updateLiveRanking(){

let totals = {};

selected.forEach(p=>{
totals[p.name] = 0;
});

for(let g of games){
for(let p of selected){

let val = parseInt(document.getElementById(g+"_"+p.id)?.value) || 0;
totals[p.name] += val;

}
}

let ranking = Object.entries(totals)
.sort((a,b)=>b[1]-a[1]);

let html = `<h3>🔥 CLASSIFICA LIVE</h3>`;

ranking.forEach((p,i)=>{
html += `<div class="box">${i+1}. ${p[0]} - ${p[1]} pt</div>`;
});

document.getElementById("liveRanking").innerHTML = html;
}  
  


function createUnoExtra(){

let html = `<h3 style="
color:orange;
text-shadow:0 0 10px orange;
font-size:22px;
margin-top:20px;
">🔥 UNO - Eliminazione (51)</h3>`;

selected.forEach(p=>{
html += `
<div class="box" id="unoBox_${p.id}">
${p.name}

<input type="number" 
id="unoInput_${p.id}" 
placeholder="punti"
style="width:70px; margin-left:10px;">

<button onclick="setUno('${p.id}')">OK</button>

<span id="unoScore_${p.id}">0</span>/51
</div>
`;
});

document.getElementById("unoExtra").innerHTML = html;
}
function setUno(id){

let input = document.getElementById("unoInput_"+id);
let val = parseInt(input.value);

/* ❌ se vuoto o non numero */
if(isNaN(val) || val <= 0) return;

/* inizializza */
if(!unoScores[id]) unoScores[id] = 0;

/* aggiunge */
unoScores[id] += val;

/* aggiorna UI */
let el = document.getElementById("unoScore_"+id);
el.innerText = unoScores[id];

/* reset input */
input.value = "";

/* eliminazione */
if(unoScores[id] >= 51){

let box = document.getElementById("unoBox_"+id);

box.style.background = "linear-gradient(45deg, darkred, black)";
box.style.boxShadow = "0 0 20px red";
box.style.transform = "scale(0.95)";

if(!box.innerHTML.includes("ELIMINATO")){
box.innerHTML += " ❌ ELIMINATO";
}

}
}

async function finish(){
let totals={};
selected.forEach(p=>totals[p.name]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p.id).value)||0;
totals[p.name]+=val;

await db.collection("gameRanking").add({
game:g,
player:p.name,
points:val,
tournament: Date.now()
});
}
}
function resetTorneo(){

gamesArea.innerHTML = "";
selected = [];

loadSelect();
unoScores = {};
document.getElementById("unoExtra").innerHTML = "";

}  
for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];
let ranking = Object.entries(totals)
.sort((a,b)=>b[1]-a[1]);

let html = `<h2>🏆 CLASSIFICA FINALE</h2>`;

ranking.forEach((p,i)=>{
html += `<div class="box">${i+1}. ${p[0]} - ${p[1]} pt</div>`;
});

html += `<button onclick="resetTorneo()">Nuovo Torneo</button>`;

document.getElementById("gamesArea").innerHTML = html;
await db.collection("palmares").add({name:winner});

}

/* PALMARES */
async function loadPalmares(){
let snap=await db.collection("palmares").get();
let data={};

snap.forEach(d=>{
data[d.data().name]=(data[d.data().name]||0)+1;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} 🏆 ${p[1]}
<button onclick="editPalmares('${p[0]}',${p[1]})">✏️</button>
<button onclick="deleteByName('palmares','${p[0]}')">❌</button></div>`;
});
palmaresList.innerHTML=html;
}

async function editPalmares(name,count){
let n = prompt("Titoli", count);
if(!n) return;

let snap = await db.collection("palmares").get();

let current = count;
let target = parseInt(n);

if(target > current){
for(let i=0;i<target-current;i++){
await db.collection("palmares").add({name:name});
}
}else{
let toDelete = current - target;

snap.forEach(async d=>{
if(toDelete>0 && d.data().name===name){
await db.collection("palmares").doc(d.id).delete();
toDelete--;
}
});
}

loadPalmares();
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
let data={};

snap.forEach(d=>{
data[d.data().name]=(data[d.data().name]||0)+d.data().points;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} ${p[1]}
<button onclick="editRanking('${p[0]}',${p[1]})">✏️</button>
<button onclick="deleteByName('ranking','${p[0]}')">❌</button></div>`;
});
rankingList.innerHTML=html;
}

async function editRanking(name,pts){

let n = prompt("Punti", pts);
if(!n) return;

let snap = await db.collection("ranking").get();

let updated = false;

for(let d of snap.docs){
if(d.data().name === name && !updated){

await db.collection("ranking").doc(d.id).update({
points: parseInt(n)
});

updated = true;
}
}

loadRanking();
}

/* PER GIOCO */
async function loadGames(){
let snap=await db.collection("gameRanking").get();
let data={};

snap.forEach(d=>{
let g = d.data().game;
let p = d.data().player;
let pts = d.data().points;

/* BLOCCA DATI ROTTI */
if(typeof p !== "string") return;

if(!data[g])data[g]={};
data[g][p]=(data[g][p]||0)+pts;
});

let html="";
let allGames = [...games, "Merda"];

for(let g of allGames){
html+=`<div class="box">
<h3>${g} <button onclick="openGamePopup('${g}')">➕</button></h3>`;
if(data[g]){
Object.entries(data[g]).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`${p[0]} ${p[1]}
<button onclick="deleteGame('${g}','${p[0]}')">❌</button><br>`;
});
}
html+="</div>";
}
gamesList.innerHTML=html;
}

/* DELETE */
async function deleteByName(col,name){

let snap = await db.collection(col).get();

let found = false;

for(let d of snap.docs){
if(d.data().name === name && !found){
await db.collection(col).doc(d.id).delete();
found = true;
}
}

show(col);
}

async function deleteGame(g,p){
let snap=await db.collection("gameRanking").get();
snap.forEach(async d=>{
if(d.data().game===g && d.data().player===p){
await db.collection("gameRanking").doc(d.id).delete();
}
});
loadGames();
}
/* 🔥 POPUP SYSTEM */

function openPopup(type){
currentType = type;
document.getElementById("popup").style.display = "block";
}
function openGamePopup(game){
currentType = "games";
currentGame = game;
document.getElementById("popup").style.display = "block";
}
function closePopup(){
document.getElementById("popup").style.display = "none";
document.getElementById("popupName").value="";
document.getElementById("popupPoints").value="";
}

async function confirmAdd(){

let name = document.getElementById("popupName").value;
let pts = parseInt(document.getElementById("popupPoints").value) || 0;

if(!name) return;

if(currentType==="palmares"){
await db.collection("palmares").add({name:name});
loadPalmares();
}

if(currentType==="ranking"){
await db.collection("ranking").add({name:name, points:pts});
loadRanking();
}

if(currentType==="games"){

await db.collection("gameRanking").add({
player:name,
game:currentGame,
points:pts
});

loadGames();
}

closePopup();
}  



let slotOptions = ["UNO","31","Saltacavallo","Fr0c10","Dubito"];
let slotSpinning = false;

function spinSlot(){

if(slotSpinning) return;
if(slotOptions.length === 0){
alert("Premi reset");
return;
}
slotSpinning = true;

let slot = document.getElementById("slot");

let speed = 50;
let duration = 2000;
let elapsed = 0;

let interval = setInterval(()=>{

let random = slotOptions[Math.floor(Math.random()*slotOptions.length)];
slot.innerText = random;

elapsed += speed;

if(elapsed >= duration){

clearInterval(interval);

/* rallentamento finale */
let slow = setInterval(()=>{
slot.innerText = slotOptions[Math.floor(Math.random()*slotOptions.length)];
},120);

setTimeout(()=>{

clearInterval(slow);

let index = Math.floor(Math.random()*slotOptions.length);
let result = slotOptions[index];

slot.innerText = result;

document.getElementById("wheelResult").innerHTML = "🎯 " + result;

/* rimuove */
slotOptions.splice(index,1);

slotSpinning = false;

if(slotOptions.length === 0){
alert("🔁 Finite tutte! Premi reset");
}

},800);

}

},speed);
}

function resetSlot(){
slotOptions = ["UNO","31","Saltacavallo","Fr0c10","Dubito"];
document.getElementById("slot").innerText = "?";
document.getElementById("wheelResult").innerHTML = "";
}
function startSlotPro(winner){

let reels = [
document.getElementById("reel1"),
document.getElementById("reel2"),
document.getElementById("reel3")
];

let names = selected.map(p => p.name);

/* reset */
reels.forEach(r=>{
r.innerText = "";
});

/* funzione rullo */
function spinReel(reel, stopDelay){

let speed = 40;
let elapsed = 0;

let interval = setInterval(()=>{

let random = names[Math.floor(Math.random()*names.length)];
reel.innerText = random;

elapsed += speed;

if(elapsed >= stopDelay){

clearInterval(interval);

/* rallenta */
let slow = setInterval(()=>{
reel.innerText = names[Math.floor(Math.random()*names.length)];
},120);

setTimeout(()=>{
clearInterval(slow);
reel.innerText = winner;
},600);

}

}, speed);
}

/* 3 rulli */
spinReel(reels[0], 1500);
spinReel(reels[1], 2200);
spinReel(reels[2], 3000);

/* finale */
setTimeout(()=>{

alert("🎰 JACKPOT 🎰\n🏆 VINCE: " + winner);

document.getElementById("gamesArea").innerHTML = `
<h2>🏆 ${winner}</h2>
<button onclick="resetTorneo()">Nuovo Torneo</button>
`;

document.getElementById("slotContainer").style.display="none";

}, 3500);

}  
  
</script>
