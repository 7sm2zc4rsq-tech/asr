<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url("sfondo.jpg") no-repeat center center fixed;
background-size:cover;
}

#mainTitle{
position:fixed;
top:0;
width:100%;
padding:10px;
font-size:24px;
background:rgba(0,0,0,0.4);
color:gold;
z-index:999;
}

.screen{display:none;padding-top:70px;}
.active{display:block;}

.menu-btn{
width:100%;
height:33vh;
font-size:40px;
background:rgba(0,0,0,0.3);
border:none;
color:white;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

#slotOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

#slotText{
font-size:60px;
color:gold;
}
</style>

</head>

<body>

<div id="mainTitle">🎰 Torneo Del Porco Di Dio</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio> <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<div id="slotOverlay"><div id="slotText"></div></div>

<!-- HOME -->

<div id="home" class="screen active">
<button class="menu-btn" onclick="show('tournament')">🎮 TORNEO</button>
<button class="menu-btn" onclick="show('players')">👤 GIOCATORI</button>
<button class="menu-btn" onclick="show('palmares')">🏆 PALMARES</button>
<button class="menu-btn" onclick="show('ranking')">📊 CLASSIFICA</button>
<button class="menu-btn" onclick="show('history')">📜 STORICO</button>
</div>

<!-- GIOCATORI -->

<div id="players" class="screen">
<h2>Giocatori</h2>
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- PALMARES -->

<div id="palmares" class="screen">
<h2>Palmares</h2>
<div id="palmaresList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- CLASSIFICA -->

<div id="ranking" class="screen">
<h2>Classifica Totale</h2>
<div id="rankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- STORICO -->

<div id="history" class="screen">
<h2>Storico Tornei</h2>
<div id="historyList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- TORNEO -->

<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="goHome()">⬅️</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIza...",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=getFirestore(app);

let games=["UNO","31","Saltacavallo","Fr0cio","Dubito","Las Vegas"];
let selected=[];

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="palmares")loadPalmares();
if(id==="ranking")loadRanking();
if(id==="history")loadHistory();
if(id==="tournament")loadSelectPlayers();
}
function goHome(){show("home");}

/* PLAYERS */
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await addDoc(collection(db,"players"),{name:n});
loadPlayers();
}
async function loadPlayers(){
let snap=await getDocs(collection(db,"players"));
playersList.innerHTML="";
snap.forEach(d=>{
playersList.innerHTML+=`
<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="deletePlayer('${d.id}')">❌</button>
</div>`;
});
}
async function deletePlayer(id){await deleteDoc(doc(db,"players",id));loadPlayers();}
async function editPlayer(id,n){
let nuovo=prompt("Nuovo nome",n);
if(!nuovo)return;
await updateDoc(doc(db,"players",id),{name:nuovo});
loadPlayers();
}

/* SELECT */
async function loadSelectPlayers(){
selected=[];
let snap=await getDocs(collection(db,"players"));
selectPlayers.innerHTML="";
snap.forEach(d=>{
let n=d.data().name;
selectPlayers.innerHTML+=`<div class="box"><input type="checkbox" value="${n}" onchange="toggle(this)"> ${n}</div>`;
});
}
function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/* GAMES */
function prepareGames(){
gamesArea.innerHTML="";
selected.forEach(p=>{
gamesArea.innerHTML+=`<div class="box">${p}<input id="${p}" type="number" value="0"></div>`;
});
gamesArea.innerHTML+=`<button onclick="finish()">Fine</button>`;
}

/* SLOT */
function slot(w){
slotOverlay.style.display="flex";
let i=0;
let int=setInterval(()=>{
slotText.innerText=selected[Math.floor(Math.random()*selected.length)];
i++;
if(i>30){
clearInterval(int);
slotText.innerText=w;
setTimeout(()=>{
slotOverlay.style.display="none";
alert("Vincitore: "+w);
goHome();
},1500);
}
},80);
}

/* FINISH */
async function finish(){
let totals={};
selected.forEach(p=>totals[p]=parseInt(document.getElementById(p).value)||0);

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];

/* salva palmares */
await addDoc(collection(db,"palmares"),{
winner: winner,
points: totals[winner],
date: new Date().toLocaleDateString()
});

/* aggiorna classifica */
for(let p in totals){
let ref=doc(db,"ranking",p);
await updateDoc(ref,{points: totals[p]}).catch(async()=>{
await addDoc(collection(db,"ranking"),{name:p,points:totals[p]});
});
}

/* storico */
await addDoc(collection(db,"history"),{
players:selected,
scores:totals,
winner:winner
});

slot(winner);
}

/* PALMARES */
async function loadPalmares(){
let snap=await getDocs(collection(db,"palmares"));
palmaresList.innerHTML="";
snap.forEach(d=>{
palmaresList.innerHTML+=`<div class="box">${d.data().winner} ${d.data().points}</div>`;
});
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await getDocs(collection(db,"ranking"));
rankingList.innerHTML="";
snap.forEach(d=>{
rankingList.innerHTML+=`<div class="box">${d.data().name} ${d.data().points}</div>`;
});
}

/* STORICO */
async function loadHistory(){
let snap=await getDocs(collection(db,"history"));
historyList.innerHTML="";
snap.forEach(d=>{
historyList.innerHTML+=`<div class="box">🏆 ${d.data().winner}</div>`;
});
}

/* GLOBAL */
window.show=show;
window.goHome=goHome;
window.addPlayer=addPlayer;
window.deletePlayer=deletePlayer;
window.editPlayer=editPlayer;
window.toggle=toggle;
window.prepareGames=prepareGames;
window.finish=finish;
</script>

</body>
</html>
