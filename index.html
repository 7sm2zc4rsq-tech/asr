<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo Del Porco Di Dio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:#111;
color:white;
text-align:center;
}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
padding:10px;
margin:5px;
font-size:16px;
}

.box{
border:1px solid white;
margin:10px;
padding:10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
<h2>Torneo</h2>
<button onclick="show('players')">Giocatori</button>
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('ranking')">Classifica</button>
<button onclick="show('gamesRanking')">Per Gioco</button>
<button onclick="show('wheelPage')">Ruota</button>
</div>

<!-- GIOCATORI -->
<div id="players" class="screen">
<h2>Giocatori</h2>
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- TORNEO -->
<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- CLASSIFICA -->
<div id="ranking" class="screen">
<h2>Classifica Totale</h2>
<div id="rankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- PER GIOCO -->
<div id="gamesRanking" class="screen">
<h2>Classifica per Gioco</h2>
<div id="gamesRankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- RUOTA -->
<div id="wheelPage" class="screen">
<h2>Ruota</h2>

<input id="wheelInput">
<button onclick="addOption()">Aggiungi</button>

<div id="wheelOptions"></div>

<button onclick="spinWheel()">Gira</button>

<button onclick="goHome()">⬅️</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE /
firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db = firebase.firestore();

/ DATI /
let selected=[];
let wheelOptions=[];
let games=["UNO","31","Saltacavallo","Dubito"];

/ NAV /
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players") loadPlayers();
if(id==="tournament") loadSelectPlayers();
if(id==="ranking") loadRanking();
if(id==="gamesRanking") loadGamesRanking();
}

function goHome(){show("home");}

/ GIOCATORI /
async function addPlayer(){
let n=document.getElementById("playerName").value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=<div class="box">${d.data().name} <button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button> <button onclick="deleteItem('players','${d.id}')">❌</button> </div>;
});
document.getElementById("playersList").innerHTML=html;
}

async function editPlayer(id,n){
let nuovo=prompt("Nuovo nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}

async function deleteItem(col,id){
await db.collection(col).doc(id).delete();
show(col==="players"?"players":"home");
}

/ SELECT /
async function loadSelectPlayers(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
let name=d.data().name;
html+=<div><input type="checkbox" value="${name}" onchange="toggle(this)"> ${name}</div>;
});
document.getElementById("selectPlayers").innerHTML=html;
}

function toggle(e){
if(e.checked) selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/ GIOCHI /
function prepareGames(){
let html="";
games.forEach(g=>{
html+=<h3>${g}</h3>;
selected.forEach(p=>{
html+=${p} <input id="${g}_${p}" type="number" value="0"><br>;
});
});
html+=<button onclick="finish()">Fine Torneo</button>;
document.getElementById("gamesArea").innerHTML=html;
}

/ FINE /
async function finish(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p).value)||0;
totals[p]+=val;

await db.collection("gameRanking").add({game:g,player:p,points:val});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

alert("Torneo salvato");
goHome();
}

/ CLASSIFICA /
async function loadRanking(){
let snap=await db.collection("ranking").get();
let html="";
snap.forEach(d=>{
html+=<div class="box">${d.data().name} ${d.data().points}</div>;
});
document.getElementById("rankingList").innerHTML=html;
}

/ PER GIOCO ORDINATO /
async function loadGamesRanking(){
let snap=await db.collection("gameRanking").get();

let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g]) data[g]={};
if(!data[g][p]) data[g][p]=0;

data[g][p]+=pts;
});

let html="";
for(let g in data){
html+=<div class="box"><h3>${g}</h3>;
let arr=Object.entries(data[g]).sort((a,b)=>b[1]-a[1]);
arr.forEach(p=>{
html+=${p[0]} - ${p[1]}<br>;
});
html+=</div>;
}

document.getElementById("gamesRankingList").innerHTML=html;
}

/ RUOTA */
function addOption(){
let v=document.getElementById("wheelInput").value;
if(!v)return;
wheelOptions.push(v);
document.getElementById("wheelOptions").innerHTML=wheelOptions.join("<br>");
}

function spinWheel(){
if(wheelOptions.length===0)return;
let r=wheelOptions[Math.floor(Math.random()*wheelOptions.length)];
alert("🎡 "+r);
}
</script>

</body>
</
