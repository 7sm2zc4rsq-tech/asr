<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo Del Porco Di Dio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url('sfondo.jpg') no-repeat center center fixed;
background-size:cover;
}

.overlay{
background:rgba(0,0,0,0.6);
min-height:100vh;
padding:20px;
}

.screen{display:none;}
.active{display:block;}

h1{color:gold;}

.menu button{
display:block;
width:85%;
margin:15px auto;
padding:20px;
font-size:20px;
border-radius:20px;
background:rgba(255,255,255,0.2);
color:white;
border:none;
cursor:pointer;
z-index:10;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

input{padding:8px;margin:5px;}

#wheel{
width:250px;height:250px;
border-radius:50%;
margin:auto;
transition:transform 3s ease-out;
}

#pointer{
width:0;
height:0;
border-left:15px solid transparent;
border-right:15px solid transparent;
border-bottom:30px solid white;
margin:auto;
}
</style>

</head>

<body>
<div class="overlay">

<div id="home" class="screen active">
<h1>Torneo Del Porco Di Dio</h1>
<div class="menu">
<button onclick="show('players')">Giocatori</button>
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('ranking')">Classifica</button>
<button onclick="show('palmares')">Palmares</button>
<button onclick="show('games')">Per Gioco</button>
<button onclick="show('wheelPage')">Ruota</button>
</div>
</div>

<div id="players" class="screen">
<input id="playerName"><button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<div id="palmares" class="screen">
<h2>Palmares</h2>
<div id="palmaresList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<div id="tournament" class="screen">
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="show('home')">⬅️</button>
</div>

<div id="ranking" class="screen">
<div id="rankingList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<div id="games" class="screen">
<div id="gamesList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<div id="wheelPage" class="screen">
<div id="pointer"></div>
<div id="wheel"></div>
<input id="wheelInput">
<button onclick="addOption()">Aggiungi</button>
<div id="wheelOptions"></div>
<button onclick="spin()">Gira</button>
<button onclick="show('home')">⬅️</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
window.onload=function(){

firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=firebase.firestore();

let selected=[];
let options=[];
let games=["UNO","31","Saltacavallo","Fr0c10","Dubito","Las Vegas"];

/* NAV */
window.show=function(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="ranking")loadRanking();
if(id==="palmares")loadPalmares();
if(id==="games")loadGames();
if(id==="tournament")loadSelect();
if(id==="wheelPage")renderWheel();
}

/* PLAYERS */
window.addPlayer=async()=>{
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="del('players','${d.id}')">❌</button></div>`;
});
playersList.innerHTML=html;
}

window.editPlayer=async(id,n)=>{
let nuovo=prompt("Nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}

window.del=async(col,id)=>{
await db.collection(col).doc(id).delete();
show(col==="players"?"players":col);
}

/* SELECT */
async function loadSelect(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
let n=d.data().name;
html+=`<div><input type="checkbox" value="${n}" onchange="toggle(this)"> ${n}</div>`;
});
selectPlayers.innerHTML=html;
}

window.toggle=e=>{
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/* GAMES */
window.prepareGames=()=>{
let html="";
games.forEach(g=>{
html+=`<h3>${g}</h3>`;
selected.forEach(p=>{
html+=`${p}<input id="${g}_${p}" value="0"><br>`;
});
});
html+=`<button onclick="finish()">Fine Torneo</button>`;
gamesArea.innerHTML=html;
}

/* FINISH */
window.finish=async()=>{
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p).value)||0;
totals[p]+=val;

await db.collection("gameRanking").add({game:g,player:p,points:val});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];
await db.collection("palmares").add({name:winner});

alert("🏆 "+winner);
show("tournament");
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name} ${d.data().points}
<button onclick="editScore('${d.id}',${d.data().points})">✏️</button>
<button onclick="del('ranking','${d.id}')">❌</button>
</div>`;
});
rankingList.innerHTML=html;
}

window.editScore=async(id,p)=>{
let n=prompt("Punti",p);
if(!n)return;
await db.collection("ranking").doc(id).update({points:parseInt(n)});
loadRanking();
}

/* PER GIOCO ORDINATO */
async function loadGames(){
let snap=await db.collection("gameRanking").get();

let data={};
snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g])data[g]={};
if(!data[g][p])data[g][p]=0;
data[g][p]+=pts;
});

let html="";
for(let g of games){
if(!data[g])continue;

html+=`<div class="box"><h3>${g}</h3>`;

Object.entries(data[g]).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`${p[0]} ${p[1]}
<button onclick="editGame('${g}','${p[0]}',${p[1]})">✏️</button><br>`;
});

html+=`</div>`;
}

gamesList.innerHTML=html;
}

window.editGame=async(g,p,pts)=>{
let n=prompt("Punti",pts);
if(!n)return;

let snap=await db.collection("gameRanking")
.where("game","==",g)
.where("player","==",p)
.get();

snap.forEach(async d=>{
await db.collection("gameRanking").doc(d.id).update({points:parseInt(n)});
});

loadGames();
}

/* RUOTA */
window.addOption=()=>{
let v=wheelInput.value;
if(!v)return;
options.push(v);
renderWheel();
}

function renderWheel(){
let step=360/options.length;
let gradient="";
options.forEach((o,i)=>{
gradient+=`hsl(${i*step},70%,50%) ${i*step}deg ${(i+1)*step}deg,`;
});
wheel.style.background=`conic-gradient(${gradient.slice(0,-1)})`;
wheelOptions.innerHTML=options.join("<br>");
}

window.spin=()=>{
let deg=360*5 + Math.random()*360;
wheel.style.transform=`rotate(${deg}deg)`;

setTimeout(()=>{
let index=Math.floor(Math.random()*options.length);
let color=`hsl(${index*(360/options.length)},70%,50%)`;
alert("🎡 "+options[index]+" ("+color+")");
},3000);
}

};
</script>

</body>
</html>
