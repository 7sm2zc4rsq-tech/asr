<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url('sfondo.jpg') no-repeat center center fixed;
background-size:cover;
}

/* OVERLAY FIXATO */
.overlay{
background:rgba(0,0,0,0.6);
min-height:100vh;
padding:20px;
}

/* SCHERMATE */
.screen{display:none;}
.active{display:block;}

h1{
color:gold;
font-size:32px;
margin-bottom:30px;
}

/* BOTTONI */
.menu button{
display:block;
width:85%;
margin:15px auto;
padding:20px;
font-size:20px;
border:none;
border-radius:20px;
background:rgba(255,255,255,0.2);
color:white;
cursor:pointer;
position:relative;
z-index:10; /* FIX CLICK */
}

/* BOX */
.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

/* INPUT */
input{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
}
</style>

</head>

<body>

<div class="overlay">

<!-- HOME -->

<div id="home" class="screen active">
<h1>Torneo Del Porco Di Dio</h1>

<div class="menu">
<button onclick="show('players')">Giocatori</button>
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('ranking')">Classifica</button>
<button onclick="show('games')">Per Gioco</button>
<button onclick="show('wheel')">Ruota</button>
</div>
</div>

<!-- GIOCATORI -->

<div id="players" class="screen">
<h2>Giocatori</h2>

<input id="playerName" placeholder="Nome">
<button onclick="addPlayer()">Aggiungi</button>

<div id="playersList"></div>

<button onclick="show('home')">⬅️</button>

</div>

<!-- TORNEO -->

<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>

<div id="selectPlayers"></div>

<button onclick="prepareGames()">Continua</button>

<div id="gamesArea"></div>

<button onclick="show('home')">⬅️</button>

</div>

<!-- CLASSIFICA -->

<div id="ranking" class="screen">
<h2>Classifica</h2>
<div id="rankingList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- PER GIOCO -->

<div id="games" class="screen">
<h2>Per Gioco</h2>
<div id="gamesList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- RUOTA -->

<div id="wheel" class="screen">
<h2>Ruota</h2>

<input id="wheelInput" placeholder="Opzione">
<button onclick="addOption()">Aggiungi</button>

<div id="wheelOptions"></div>

<button onclick="spin()">Gira</button>

<button onclick="show('home')">⬅️</button>

</div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
window.onload = function(){

firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db = firebase.firestore();

let selected=[];
let options=[];
let games=["UNO","31","Saltacavallo","Dubito"];

/* NAV */
window.show = function(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players") loadPlayers();
if(id==="tournament") loadSelect();
if(id==="ranking") loadRanking();
if(id==="games") loadGames();
}

/* GIOCATORI */
window.addPlayer = async function(){
let n=document.getElementById("playerName").value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="deletePlayer('${d.id}')">❌</button>
</div>`;
});
playersList.innerHTML=html;
}

window.editPlayer = async function(id,name){
let n=prompt("Nome",name);
if(!n)return;
await db.collection("players").doc(id).update({name:n});
loadPlayers();
}

window.deletePlayer = async function(id){
await db.collection("players").doc(id).delete();
loadPlayers();
}

/* SELECT */
async function loadSelect(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
let name=d.data().name;
html+=`<div><input type="checkbox" value="${name}" onchange="toggle(this)"> ${name}</div>`;
});
selectPlayers.innerHTML=html;
}

window.toggle = function(e){
if(e.checked) selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/* GIOCHI */
window.prepareGames = function(){
let html="";
games.forEach(g=>{
html+=`<h3>${g}</h3>`;
selected.forEach(p=>{
html+=`${p} <input id="${g}_${p}" type="number" value="0"><br>`;
});
});
html+=`<button onclick="finish()">Fine</button>`;
gamesArea.innerHTML=html;
}

/* FINE */
window.finish = async function(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p).value)||0;
totals[p]+=val;

await db.collection("gameRanking").add({game:g,player:p,points:val});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

alert("Torneo salvato");
show("home");
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name} - ${d.data().points}</div>`;
});
rankingList.innerHTML=html;
}

/* PER GIOCO */
async function loadGames(){
let snap=await db.collection("gameRanking").get();

let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g]) data[g]={};
if(!data[g][p]) data[g][p]=0;

data[g][p]+=pts;
});

let html="";
for(let g in data){
html+=`<div class="box"><h3>${g}</h3>`;
Object.entries(data[g]).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`${p[0]} - ${p[1]}<br>`;
});
html+=`</div>`;
}

gamesList.innerHTML=html;
}

/* RUOTA */
window.addOption = function(){
let v=wheelInput.value;
if(!v)return;
options.push(v);
wheelOptions.innerHTML=options.join("<br>");
}

window.spin = function(){
if(options.length===0)return;
let r=options[Math.floor(Math.random()*options.length)];
alert("🎡 "+r);
}

};
</script>

</body>
</html>
