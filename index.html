<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
.reel{
width:120px;
height:120px;
background:black;
border:3px solid gold;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
color:white;
box-shadow:0 0 15px gold;
}  
body{
margin:0;
font-family:'Cinzel',serif;
color:white;
text-align:center;
background:url('sfondo.jpg') no-repeat center center fixed;
background-size:cover;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:20px;
}

h1{
font-size:34px;
color:#ff4500;
text-shadow:0 0 10px red,0 0 25px orange;
}

.screen{display:none;}
.active{display:block;}

.menu button{
display:block;
width:90%;
margin:15px auto;
padding:20px;
font-size:22px;
border-radius:20px;
background:rgba(255,255,255,0.15);
border:none;
color:white;
cursor:pointer;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

input{padding:8px;margin:5px;}

#wheel{
width:260px;height:260px;
border-radius:50%;
margin:auto;
transition:transform 4s ease-out;
}

#pointer{
width:0;
height:0;
border-left:15px solid transparent;
border-right:15px solid transparent;
border-bottom:30px solid white;
margin:auto;
}
#wheel{
position:relative;
}  
</style>

</head>

<body>
<div class="overlay">

<!-- HOME -->

<div id="home" class="screen active">
<h1>Torneo Del Porco Di Dio</h1>
<div class="menu">
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('players')">Giocatori</button>
<button onclick="show('wheelPage')">Ruota</button>
<button onclick="show('palmares')">Palmares</button>
<button onclick="show('ranking')">Classifica Totale</button>
<button onclick="show('games')">Classifica Per Gioco</button>
</div>
</div>

<!-- GIOCATORI -->

<div id="players" class="screen">
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- TORNEO -->

<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="startGames()">Inizia</button>
<div id="gamesArea"></div>
<div id="slotContainer" style="display:none; margin-top:20px;">
  <div style="display:flex; justify-content:center; gap:10px;">
    <div class="reel" id="reel1"></div>
    <div class="reel" id="reel2"></div>
    <div class="reel" id="reel3"></div>
  </div>
</div>  
<button onclick="show('home')">⬅️</button>
</div>

<!-- PALMARES -->

<div id="palmares" class="screen">
<div id="palmaresList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- CLASSIFICA -->

<div id="ranking" class="screen">
<div id="rankingList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- PER GIOCO -->

<div id="games" class="screen">
<div id="gamesList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- RUOTA -->

<div id="wheelPage" class="screen">
<div id="pointer"></div>
<div id="wheel"></div>
<button onclick="spin()">Gira</button>
<div id="wheelResult"></div>
<button onclick="resetWheel()">Rigioca</button>
<button onclick="show('home')">⬅️</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=firebase.firestore();

let games=["UNO","31","Saltacavallo","Fr0c10","Dubito","Las Vegas"];
let selected=[];

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="ranking")loadRanking();
if(id==="palmares")loadPalmares();
if(id==="games")loadGames();
if(id==="tournament")loadSelect();
}

/* GIOCATORI */
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="deleteDoc('players','${d.id}')">❌</button></div>`;
});
playersList.innerHTML=html;
}

async function editPlayer(id,n){
let nuovo=prompt("Nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}

/* DELETE */
async function deleteDoc(col,id){
await db.collection(col).doc(id).delete();
show(col);
}

/* TORNEO */
async function loadSelect(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<input type="checkbox" value="${d.data().name}" onchange="toggle(this)"> ${d.data().name}<br>`;
});
selectPlayers.innerHTML=html;
}

function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

function startGames(){
let html="";
games.forEach(g=>{
html+=`<h3>${g}</h3>`;
selected.forEach(p=>{
html+=`${p}<input id="${g}_${p}" value="0"><br>`;
});
});
html+=`<button onclick="finish()">Fine Torneo</button>`;
gamesArea.innerHTML=html;
}

async function finish(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p).value)||0;
totals[p]+=val;
await db.collection("gameRanking").add({game:g,player:p,points:val});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];
await db.collection("palmares").add({name:winner});

/* animazione */
startSlotPro(winner);  
}

function resetTorneo(){
gamesArea.innerHTML="";
show("tournament");
}

/* PALMARES */
async function loadPalmares(){
let snap=await db.collection("palmares").get();
let data={};

snap.forEach(d=>{
data[d.data().name]=(data[d.data().name]||0)+1;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} 🏆 ${p[1]}
<button onclick="editPalmares('${p[0]}',${p[1]})">✏️</button>
<button onclick="deleteByName('palmares','${p[0]}')">❌</button></div>`;
});
palmaresList.innerHTML=html;
}

function editPalmares(name,count){
let n=prompt("Nuovo valore",count);
if(!n)return;
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
let data={};

snap.forEach(d=>{
data[d.data().name]=(data[d.data().name]||0)+d.data().points;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} ${p[1]}
<button onclick="editRanking('${p[0]}',${p[1]})">✏️</button>
<button onclick="deleteByName('ranking','${p[0]}')">❌</button></div>`;
});
rankingList.innerHTML=html;
}

function editRanking(name,pts){
let n=prompt("Punti",pts);
}

/* PER GIOCO */
async function loadGames(){
let snap=await db.collection("gameRanking").get();
let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g])data[g]={};
data[g][p]=(data[g][p]||0)+pts;
});

let html="";
for(let g of games){
html+=`<div class="box"><h3>${g}</h3>`;
if(data[g]){
Object.entries(data[g]).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`${p[0]} ${p[1]}
<button onclick="deleteGame('${g}','${p[0]}')">❌</button><br>`;
});
}
html+="</div>";
}
gamesList.innerHTML=html;
}

/* DELETE */
async function deleteByName(col,name){
let snap=await db.collection(col).get();
snap.forEach(async d=>{
if(d.data().name===name){
await db.collection(col).doc(d.id).delete();
}
});
show(col);
}

async function deleteGame(g,p){
let snap=await db.collection("gameRanking").get();
snap.forEach(async d=>{
if(d.data().game===g && d.data().player===p){
await db.collection("gameRanking").doc(d.id).delete();
}
});
loadGames();
}

/* RUOTA PRO */

let originalOptions=["UNO","31","Saltacavallo","Fr0c10","Dubito"];
let originalColors=["red","blue","green","purple","orange"];

let options=[...originalOptions];
let colors=[...originalColors];

let spinning=false;

/* DISEGNA RUOTA CON NOMI */
function drawWheel(){
let step=360/options.length;
let gradient="";
options.forEach((o,i)=>{
gradient+=`${colors[i]} ${i*step}deg ${(i+1)*step}deg,`;
});
wheel.style.background=`conic-gradient(${gradient.slice(0,-1)})`;

/* scritte sopra la ruota */
wheel.innerHTML="";
options.forEach((o,i)=>{
let angle=(i*360/options.length)+(180/options.length);

let label=document.createElement("div");
label.innerText=o;
label.style.position="absolute";
label.style.transform=`rotate(${angle}deg) translate(100px) rotate(-${angle}deg)`;
label.style.transformOrigin="center";
label.style.fontSize="12px";

wheel.appendChild(label);
});
}

drawWheel();

/* SPIN */
function spin(){

if(spinning || options.length===0)return;
spinning=true;

let step=360/options.length;
let index=Math.floor(Math.random()*options.length);

/* calcolo perfetto per puntatore */
let deg=360*5 + (360 - (index*step + step/2));

wheel.style.transform=`rotate(${deg}deg)`;

setTimeout(()=>{

let result=options[index];

wheelResult.innerHTML="🎯 "+result;

/* RIMUOVE OPZIONE USCITA */
options.splice(index,1);
colors.splice(index,1);

spinning=false;

/* se finite → reset */
if(options.length===0){
setTimeout(()=>{
options=[...originalOptions];
colors=[...originalColors];
drawWheel();
alert("🔁 Tutte le opzioni usate, reset!");
},1000);
}else{
drawWheel();
}

},4000);
}

/* RESET MANUALE */
function resetWheel(){
wheel.style.transform="rotate(0deg)";
wheelResult.innerHTML="";
spinning=false;
}
function startSlotPro(winner){

document.getElementById("slotContainer").style.display="block";

let reels = [
document.getElementById("reel1"),
document.getElementById("reel2"),
document.getElementById("reel3")
];

let names = selected;

function spinReel(reel, delay, stopName){

let speed = 50;
let count = 0;

let interval = setInterval(()=>{

let random = names[Math.floor(Math.random()*names.length)];
reel.innerHTML = random;

count++;

if(count > delay){

clearInterval(interval);

let slow = setInterval(()=>{
reel.innerHTML = names[Math.floor(Math.random()*names.length)];
},120);

setTimeout(()=>{
clearInterval(slow);
reel.innerHTML = stopName;
},500);

}

}, speed);
}

// 3 rulli con stop progressivo
spinReel(reels[0], 20, winner);
spinReel(reels[1], 30, winner);
spinReel(reels[2], 40, winner);

// finale
setTimeout(()=>{

alert("🎰 JACKPOT 🎰\n🏆 VINCE: " + winner);

document.getElementById("gamesArea").innerHTML = `
<h2>🏆 ${winner}</h2>
<button onclick="resetTorneo()">Nuovo Torneo</button>
`;

document.getElementById("slotContainer").style.display="none";

}, 4000);

}
</script>

</body>
</html>
