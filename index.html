<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:black;
color:white;
text-align:center;
}

.screen{display:none;}
.active{display:block;}

button{
padding:12px;
margin:5px;
font-size:16px;
}

.box{
border:1px solid white;
margin:10px;
padding:10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
<h2>TORNEO</h2>
<button onclick="show('players')">Giocatori</button>
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('ranking')">Classifica</button>
<button onclick="show('games')">Per Gioco</button>
<button onclick="show('wheel')">Ruota</button>
</div>

<!-- GIOCATORI -->
<div id="players" class="screen">
<h2>Giocatori</h2>
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- TORNEO -->
<div id="tournament" class="screen">
<h2>Torneo</h2>
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- CLASSIFICA -->
<div id="ranking" class="screen">
<h2>Classifica</h2>
<div id="rankingList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- PER GIOCO -->
<div id="games" class="screen">
<h2>Per Gioco</h2>
<div id="gamesList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- RUOTA -->
<div id="wheel" class="screen">
<h2>Ruota</h2>

<input id="wheelInput">
<button onclick="addOption()">Aggiungi</button>

<div id="wheelOptions"></div>

<button onclick="spin()">Gira</button>

<button onclick="show('home')">⬅️</button>
</div>

<script>
let players=[];
let ranking={};
let gameRanking={};
let selected=[];
let options=[];

/* NAV /
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players") renderPlayers();
if(id==="tournament") renderSelect();
if(id==="ranking") renderRanking();
if(id==="games") renderGames();
}

/ GIOCATORI /
function addPlayer(){
let n=document.getElementById("playerName").value;
if(!n)return;
players.push(n);
renderPlayers();
}

function renderPlayers(){
let html="";
players.forEach((p,i)=>{
html+=<div class="box">${p} <button onclick="editPlayer(${i})">✏️</button> <button onclick="removePlayer(${i})">❌</button></div>;
});
playersList.innerHTML=html;
}

function editPlayer(i){
let n=prompt("Nome",players[i]);
if(n) players[i]=n;
renderPlayers();
}

function removePlayer(i){
players.splice(i,1);
renderPlayers();
}

/ SELECT /
function renderSelect(){
let html="";
players.forEach(p=>{
html+=<div><input type="checkbox" value="${p}" onchange="toggle(this)"> ${p}</div>;
});
selectPlayers.innerHTML=html;
}

function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(x=>x!==e.value);
}

/ GAMES /
let games=["UNO","31"];

function prepareGames(){
let html="";
games.forEach(g=>{
html+=<h3>${g}</h3>;
selected.forEach(p=>{
html+=${p} <input id="${g}_${p}" type="number" value="0"><br>;
});
});
html+=<button onclick="finish()">Fine</button>;
gamesArea.innerHTML=html;
}

/ FINISH /
function finish(){
selected.forEach(p=>ranking[p]=(ranking[p]||0));

games.forEach(g=>{
selected.forEach(p=>{
let val=parseInt(document.getElementById(g+"_"+p).value)||0;

ranking[p]+=val;

if(!gameRanking[g])gameRanking[g]={};
if(!gameRanking[g][p])gameRanking[g][p]=0;

gameRanking[g][p]+=val;
});
});

alert("Fatto");
show("home");
}

/ CLASSIFICA /
function renderRanking(){
let html="";
Object.entries(ranking).forEach(p=>{
html+=<div class="box">${p[0]} ${p[1]}</div>;
});
rankingList.innerHTML=html;
}

/ PER GIOCO /
function renderGames(){
let html="";
for(let g in gameRanking){
html+=<div class="box"><h3>${g}</h3>;
Object.entries(gameRanking[g]).forEach(p=>{
html+=${p[0]} ${p[1]}<br>;
});
html+=</div>;
}
gamesList.innerHTML=html;
}

/ RUOTA */
function addOption(){
let v=wheelInput.value;
if(!v)return;
options.push(v);
wheelOptions.innerHTML=options.join("<br>");
}

function spin(){
if(options.length===0)return;
let r=options[Math.floor(Math.random()*options.length)];
alert(r);
}
</script>

</body>
</
