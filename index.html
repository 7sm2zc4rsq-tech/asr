<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url("sfondo.jpg") no-repeat center center fixed;
background-size:cover;
}

#mainTitle{
position:fixed;
top:0;
width:100%;
padding:10px;
background:rgba(0,0,0,0.5);
color:gold;
z-index:999;
}

.screen{display:none;padding-top:70px;}
.active{display:block;}

.menu-btn{
width:100%;
height:20vh;
font-size:28px;
background:rgba(0,0,0,0.3);
border:none;
color:white;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

#slotOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

#slotText{
font-size:60px;
color:gold;
}
</style>

</head>

<body>

<div id="mainTitle">🎰 Torneo Del Porco Di Dio</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio> <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<div id="slotOverlay"><div id="slotText"></div></div>

<!-- HOME -->

<div id="home" class="screen active">
<button class="menu-btn" onclick="show('tournament')">🎮 TORNEO</button>
<button class="menu-btn" onclick="show('players')">👤 GIOCATORI</button>
<button class="menu-btn" onclick="show('palmares')">🏆 PALMARES</button>
<button class="menu-btn" onclick="show('ranking')">📊 CLASSIFICA</button>
<button class="menu-btn" onclick="show('gamesRanking')">🎯 PER GIOCO</button>
<button class="menu-btn" onclick="show('history')">📜 STORICO</button>
</div>

<!-- GIOCATORI -->

<div id="players" class="screen">
<h2>Giocatori</h2>
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- PALMARES -->

<div id="palmares" class="screen">
<h2>Palmares</h2>
<div id="palmaresList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- CLASSIFICA -->

<div id="ranking" class="screen">
<h2>Classifica Totale</h2>
<div id="rankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- CLASSIFICA GIOCHI -->

<div id="gamesRanking" class="screen">
<h2>Classifica per Gioco</h2>
<div id="gamesRankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- STORICO -->

<div id="history" class="screen">
<h2>Storico</h2>
<div id="historyList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- TORNEO -->

<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- FIREBASE COMPAT (NO BUG CLICK) -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const app = firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db = firebase.firestore();

let games=["UNO","31","Saltacavallo","Fr0cio","Dubito","Las Vegas"];
let selected=[];

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="palmares")loadPalmares();
if(id==="ranking")loadRanking();
if(id==="gamesRanking")loadGamesRanking();
if(id==="history")loadHistory();
if(id==="tournament")loadSelectPlayers();
}
function goHome(){show("home");}

/* PLAYERS */
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}
async function loadPlayers(){
let snap=await db.collection("players").get();
playersList.innerHTML="";
snap.forEach(d=>{
playersList.innerHTML+=`
<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="deleteItem('players','${d.id}')">❌</button>
</div>`;
});
}
async function deleteItem(col,id){
await db.collection(col).doc(id).delete();
show(col==="players"?"players":col==="palmares"?"palmares":col==="ranking"?"ranking":col==="gameRanking"?"gamesRanking":"home");
}
async function editPlayer(id,n){
let nuovo=prompt("Nuovo nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}

/* SELECT */
async function loadSelectPlayers(){
selected=[];
let snap=await db.collection("players").get();
selectPlayers.innerHTML="";
snap.forEach(d=>{
let n=d.data().name;
selectPlayers.innerHTML+=`<div class="box"><input type="checkbox" value="${n}" onchange="toggle(this)"> ${n}</div>`;
});
}
function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/* GAMES */
function prepareGames(){
gamesArea.innerHTML="";
games.forEach(g=>{
gamesArea.innerHTML+=`<div class="box"><h3>${g}</h3></div>`;
selected.forEach(p=>{
gamesArea.innerHTML+=`<div class="box">${p} <input id="${g}_${p}" type="number" value="0"></div>`;
});
});
gamesArea.innerHTML+=`<button onclick="finish()">🏆 Fine</button>`;
}

/* SLOT */
function slot(w){
slotOverlay.style.display="flex";
let i=0;
let int=setInterval(()=>{
slotText.innerText=selected[Math.floor(Math.random()*selected.length)];
i++;
if(i>40){
clearInterval(int);
slotText.innerText=w;
setTimeout(()=>{
slotOverlay.style.display="none";
alert("🏆 Vincitore: "+w);
goHome();
},1500);
}
},80);
}

/* FINISH */
async function finish(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(`${g}_${p}`).value)||0;
totals[p]+=val;

await db.collection("gameRanking").add({
game:g,
player:p,
points:val
});
}
}

for(let p in totals){
await db.collection("ranking").add({
name:p,
points:totals[p]
});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];

await db.collection("palmares").add({
winner:winner,
points:totals[winner],
date:new Date().toLocaleDateString()
});

await db.collection("history").add({
players:selected,
scores:totals,
winner:winner
});

slot(winner);
}

/* PALMARES */
async function loadPalmares(){
let snap=await db.collection("palmares").get();
palmaresList.innerHTML="";
snap.forEach(d=>{
palmaresList.innerHTML+=`
<div class="box">
${d.data().winner} (${d.data().points})
<button onclick="editValue('palmares','${d.id}',${d.data().points})">✏️</button>
<button onclick="deleteItem('palmares','${d.id}')">❌</button>
</div>`;
});
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
rankingList.innerHTML="";
snap.forEach(d=>{
rankingList.innerHTML+=`
<div class="box">
${d.data().name} ${d.data().points}
<button onclick="editValue('ranking','${d.id}',${d.data().points})">✏️</button>
<button onclick="deleteItem('ranking','${d.id}')">❌</button>
</div>`;
});
}

/* CLASSIFICA PER GIOCO */
async function loadGamesRanking(){
let snap=await db.collection("gameRanking").get();
let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g])data[g]={};
if(!data[g][p])data[g][p]=0;

data[g][p]+=pts;
});

let html="";
for(let g in data){
html+=`<div class="box"><h2>${g}</h2>`;
let players=Object.entries(data[g]).sort((a,b)=>b[1]-a[1]);
players.forEach(p=>{
html+=`${p[0]} - ${p[1]} pt<br>`;
});
html+=`</div>`;
}
gamesRankingList.innerHTML=html;
}

/* STORICO */
async function loadHistory(){
let snap=await db.collection("history").get();
historyList.innerHTML="";
snap.forEach(d=>{
historyList.innerHTML+=`<div class="box">🏆 ${d.data().winner}</div>`;
});
}

/* EDIT */
async function editValue(col,id,current){
let n=prompt("Modifica",current);
if(!n)return;
await db.collection(col).doc(id).update({points:parseInt(n)});
show(col==="ranking"?"ranking":"palmares");
}
</script>

</body>
</html>
