<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: 'Orbitron', sans-serif;
  color:white;
  text-align:center;
  background: url("sfondo.jpg") no-repeat center center fixed;
  background-size: cover;
}

.screen { display:none; }
.active { display:block; }

.menu-btn {
  width:100%;
  height:33.3vh;
  font-size:42px;
  font-weight:bold;
  letter-spacing:2px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(4px);
  border:none;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.2s;
}

.menu-btn:active {
  transform:scale(0.95);
}

button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
}

input {
  padding:10px;
  margin:5px;
}

.box {
  background: rgba(0,0,0,0.6);
  margin:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- SUONI -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<!-- HOME -->
<div id="home" class="screen active">
  <button class="menu-btn" style="color:#00ffd5;" onclick="show('tournament')">🎮 NUOVO TORNEO</button>
  <button class="menu-btn" style="color:#ffcc00;" onclick="show('players')">👤 GIOCATORI</button>
  <button class="menu-btn" style="color:#ff3c3c;" onclick="show('palmares')">🏆 PALMARES</button>
</div>

<!-- GIOCATORI -->
<div id="players" class="screen">
  <h2>Giocatori</h2>
  <input id="playerName" placeholder="Nome">
  <button onclick="addPlayer()">Aggiungi</button>
  <div id="playersList"></div>
  <button onclick="goHome()">⬅️</button>
</div>

<!-- PALMARES -->
<div id="palmares" class="screen">
  <h2>Palmares</h2>
  <div id="palmaresList"></div>
  <button onclick="goHome()">⬅️</button>
</div>

<!-- TORNEO -->
<div id="tournament" class="screen">
  <h2>Seleziona Giocatori</h2>
  <div id="selectPlayers"></div>

  <button onclick="startTournament()">Inizia</button>
  <button onclick="goHome()">⬅️</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
  authDomain: "torneo-74c5b.firebaseapp.com",
  projectId: "torneo-74c5b",
  storageBucket: "torneo-74c5b.firebasestorage.app",
  messagingSenderId: "937631619179",
  appId: "1:937631619179:web:36be07ea0a2db93368b92e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// SUONI
function clickSound(){
  let s=document.getElementById("clickSound");
  s.currentTime=0;
  s.play();
}

function winSound(){
  let s=document.getElementById("winSound");
  s.currentTime=0;
  s.play();
}

// NAVIGAZIONE
function show(id){
  clickSound();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id==="players") loadPlayers();
  if(id==="palmares") loadPalmares();
  if(id==="tournament") loadSelectPlayers();
}

function goHome(){ show("home"); }

// ================= PLAYERS =================

async function addPlayer(){
  clickSound();
  let name=document.getElementById("playerName").value;
  if(!name) return;
  await addDoc(collection(db,"players"),{name});
  document.getElementById("playerName").value="";
  loadPlayers();
}

async function loadPlayers(){
  const snap=await getDocs(collection(db,"players"));
  let html="";
  snap.forEach(d=>{
    html+=`
      <div class="box">
        ${d.data().name}
        <button onclick="deletePlayer('${d.id}')">❌</button>
      </div>
    `;
  });
  document.getElementById("playersList").innerHTML=html;
}

async function deletePlayer(id){
  clickSound();
  await deleteDoc(doc(db,"players",id));
  loadPlayers();
}

// ================= SELECT PLAYERS =================

let selected=[];

async function loadSelectPlayers(){
  const snap=await getDocs(collection(db,"players"));
  let html="";
  snap.forEach(d=>{
    let name=d.data().name;
    html+=`
      <div class="box">
        <input type="checkbox" value="${name}" onchange="togglePlayer(this)">
        ${name}
      </div>
    `;
  });
  document.getElementById("selectPlayers").innerHTML=html;
}

function togglePlayer(el){
  if(el.checked) selected.push(el.value);
  else selected=selected.filter(p=>p!==el.value);
}

// ================= PALMARES =================

async function loadPalmares(){
  const snap=await getDocs(collection(db,"palmares"));
  let html="";
  snap.forEach(d=>{
    html+=`<div class="box">${d.data().winner}</div>`;
  });
  document.getElementById("palmaresList").innerHTML=html;
}

// ================= TORNEO =================

async function startTournament(){
  clickSound();

  if(selected.length===0){
    alert("Seleziona giocatori");
    return;
  }

  let winner=selected[Math.floor(Math.random()*selected.length)];

  await addDoc(collection(db,"palmares"),{winner});

  winSound(); // 🔥 SUONO VINCITORE

  setTimeout(()=>{
    alert("🏆 Vincitore: "+winner);
    goHome();
  },300);
}

// GLOBAL
window.show=show;
window.goHome=goHome;
window.addPlayer=addPlayer;
window.deletePlayer=deletePlayer;
window.togglePlayer=togglePlayer;
window.startTournament=startTournament;

</script>

</body>
</html>
