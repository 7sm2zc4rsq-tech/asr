<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
color:white;
text-align:center;
background:url("sfondo.jpg") no-repeat center center fixed;
background-size:cover;
}

#mainTitle{
position:fixed;
top:0;
width:100%;
padding:10px;
background:rgba(0,0,0,0.5);
color:gold;
z-index:999;
}

.screen{display:none;padding-top:70px;}
.active{display:block;}

.menu-btn{
width:100%;
height:16vh;
font-size:26px;
background:rgba(0,0,0,0.3);
border:none;
color:white;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

#slotOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

#slotText{
font-size:60px;
color:gold;
}

/* RUOTA /
#wheel{
width:250px;
height:250px;
border-radius:50%;
border:5px solid white;
margin:auto;
transition:transform 3s ease-out;
}
</style>
</head>

<body>

<div id="mainTitle">🎰 Torneo Del Porco Di Dio</div>

<div id="slotOverlay"><div id="slotText"></div></div>

<!-- HOME -->
<div id="home" class="screen active">
<button class="menu-btn" onclick="show('tournament')">🎮 TORNEO</button>
<button class="menu-btn" onclick="show('players')">👤 GIOCATORI</button>
<button class="menu-btn" onclick="show('palmares')">🏆 PALMARES</button>
<button class="menu-btn" onclick="show('ranking')">📊 CLASSIFICA</button>
<button class="menu-btn" onclick="show('gamesRanking')">🎯 PER GIOCO</button>
<button class="menu-btn" onclick="show('wheelPage')">🎡 RUOTA</button>
</div>

<!-- GIOCATORI -->
<div id="players" class="screen">
<h2>Giocatori</h2>
<input id="playerName">
<button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- PALMARES -->
<div id="palmares" class="screen">
<h2>Palmares</h2>
<div id="palmaresList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- CLASSIFICA -->
<div id="ranking" class="screen">
<h2>Classifica Totale</h2>
<div id="rankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- PER GIOCO -->
<div id="gamesRanking" class="screen">
<h2>Classifica per Gioco</h2>
<div id="gamesRankingList"></div>
<button onclick="goHome()">⬅️</button>
</div>

<!-- RUOTA -->
<div id="wheelPage" class="screen">
<h2>Ruota</h2>

<input id="wheelInput" placeholder="Opzione">
<button onclick="addOption()">Aggiungi</button>

<div id="wheelOptions"></div>

<div id="wheel"></div>

<button onclick="spinWheel()">Gira</button>

<button onclick="goHome()">⬅️</button>
</div>

<!-- TORNEO -->
<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="prepareGames()">Continua</button>
<div id="gamesArea"></div>
<button onclick="goHome()">⬅️</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const app=firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=firebase.firestore();

let games=["UNO","31","Saltacavallo","Fr0cio","Dubito","Las Vegas"];
let selected=[];
let wheelOptions=[];

/ NAV /
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="palmares")loadPalmares();
if(id==="ranking")loadRanking();
if(id==="gamesRanking")loadGamesRanking();
if(id==="tournament")loadSelectPlayers();
if(id==="wheelPage")renderWheel();
}
function goHome(){show("home");}

/ PLAYERS /
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}
async function loadPlayers(){
let snap=await db.collection("players").get();
playersList.innerHTML="";
snap.forEach(d=>{
playersList.innerHTML+=<div class="box">${d.data().name} <button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button> <button onclick="deleteItem('players','${d.id}')">❌</button></div>;
});
}
async function editPlayer(id,n){
let nuovo=prompt("Nuovo nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}
async function deleteItem(col,id){
await db.collection(col).doc(id).delete();
show(col==="players"?"players":col==="palmares"?"palmares":col==="ranking"?"ranking":"gamesRanking");
}

/ SELECT /
async function loadSelectPlayers(){
selected=[];
let snap=await db.collection("players").get();
selectPlayers.innerHTML="";
snap.forEach(d=>{
let n=d.data().name;
selectPlayers.innerHTML+=<div class="box"><input type="checkbox" value="${n}" onchange="toggle(this)"> ${n}</div>;
});
}
function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

/ GAMES /
function prepareGames(){
gamesArea.innerHTML="";
games.forEach(g=>{
gamesArea.innerHTML+=<div class="box"><h3>${g}</h3></div>;
selected.forEach(p=>{
gamesArea.innerHTML+=<div class="box">${p} <input id="${g}_${p}" type="number" value="0"></div>;
});
});
gamesArea.innerHTML+=<button onclick="finish()">🏆 Fine</button>;
}

/ FINISH /
async function finish(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(${g}_${p}).value)||0;
totals[p]+=val;

await db.collection("gameRanking").add({
game:g,
player:p,
points:val
});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];
await db.collection("palmares").add({winner:winner,points:totals[winner]});

alert("🏆 "+winner);
goHome();
}

/ PALMARES /
async function loadPalmares(){
let snap=await db.collection("palmares").get();
palmaresList.innerHTML="";
snap.forEach(d=>{
palmaresList.innerHTML+=<div class="box">${d.data().winner} <button onclick="deleteItem('palmares','${d.id}')">❌</button></div>;
});
}

/ CLASSIFICA /
async function loadRanking(){
let snap=await db.collection("ranking").get();
rankingList.innerHTML="";
snap.forEach(d=>{
rankingList.innerHTML+=<div class="box">${d.data().name} ${d.data().points}</div>;
});
}

/ PER GIOCO ORDINATO /
async function loadGamesRanking(){
let snap=await db.collection("gameRanking").get();
let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g])data[g]={};
if(!data[g][p])data[g][p]=0;
data[g][p]+=pts;
});

let html="";
for(let g in data){
html+=<div class="box"><h2>${g}</h2>;
let arr=Object.entries(data[g]).sort((a,b)=>b[1]-a[1]);
arr.forEach(p=>{
html+=${p[0]} - ${p[1]} pt<br>;
});
html+=</div>;
}
gamesRankingList.innerHTML=html;
}

/ RUOTA /
function addOption(){
let val=wheelInput.value;
if(!val)return;
wheelOptions.push(val);
renderWheel();
}

function renderWheel(){
wheelOptionsDiv.innerHTML="";
wheelOptions.forEach((o,i)=>{
wheelOptionsDiv.innerHTML+=<div>${o}</div>;
});

let gradient="";
let step=360/wheelOptions.length;

wheelOptions.forEach((o,i)=>{
gradient+=hsl(${i*step},70%,50%) ${i*step}deg ${(i+1)*step}deg,;
});

wheel.style.background=conic-gradient(${gradient.slice(0,-1)});
}

function spinWheel(){
let deg=3605 + Math.random()*360;
wheel.style.transform=rotate(${deg}deg);

let index=Math.floor(Math.random()*wheelOptions.length);

setTimeout(()=>{
alert("🎯 "+wheelOptions[index]);
},3000);
}
</script>

</body>
