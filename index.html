<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porco Di Dio</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<link rel="apple-touch-icon" href="icon.png">

<style>
body{
margin:0;
font-family:'Cinzel',serif;
color:white;
text-align:center;
background:url('sfondo.jpg') no-repeat center center fixed;
background-size:cover;
}

.overlay{
background:rgba(0,0,0,0.7);
min-height:100vh;
padding:20px;
}

h1{
font-size:32px;
color:#ff4500;
text-shadow:0 0 10px red,0 0 20px orange;
}

.screen{display:none;}
.active{display:block;}

.menu button{
display:block;
width:90%;
margin:15px auto;
padding:20px;
font-size:22px;
border-radius:20px;
background:rgba(255,255,255,0.15);
color:white;
border:none;
cursor:pointer;
}

.box{
background:rgba(0,0,0,0.6);
margin:10px;
padding:10px;
border-radius:10px;
}

input{padding:8px;margin:5px;}

#wheel{
width:260px;height:260px;
border-radius:50%;
margin:auto;
transition:transform 3s ease-out;
}

#pointer{
width:0;
height:0;
border-left:15px solid transparent;
border-right:15px solid transparent;
border-bottom:30px solid white;
margin:auto;
}
</style>

</head>

<body>
<div class="overlay">

<!-- HOME -->

<div id="home" class="screen active">
<h1>Torneo Del Porco Di Dio</h1>
<div class="menu">
<button onclick="show('tournament')">Nuovo Torneo</button>
<button onclick="show('players')">Giocatori</button>
<button onclick="show('wheelPage')">Ruota</button>
<button onclick="show('palmares')">Palmares</button>
<button onclick="show('ranking')">Classifica Totale</button>
<button onclick="show('games')">Classifica Per Gioco</button>
</div>
</div>

<!-- GIOCATORI -->

<div id="players" class="screen">
<input id="playerName"><button onclick="addPlayer()">Aggiungi</button>
<div id="playersList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- TORNEO -->

<div id="tournament" class="screen">
<h2>Seleziona Giocatori</h2>
<div id="selectPlayers"></div>
<button onclick="startGames()">Inizia</button>
<div id="gamesArea"></div>
</div>

<!-- PALMARES -->

<div id="palmares" class="screen">
<h2>Palmares</h2>
<div id="palmaresList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- CLASSIFICA -->

<div id="ranking" class="screen">
<h2>Classifica Totale</h2>
<div id="rankingList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- PER GIOCO -->

<div id="games" class="screen">
<h2>Classifiche per Gioco</h2>
<div id="gamesList"></div>
<button onclick="show('home')">⬅️</button>
</div>

<!-- RUOTA -->

<div id="wheelPage" class="screen">
<div id="pointer"></div>
<div id="wheel"></div>
<button onclick="spin()">Gira</button>
<div id="wheelResult"></div>
<button onclick="show('home')">⬅️</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
authDomain:"torneo-74c5b.firebaseapp.com",
projectId:"torneo-74c5b"
});

const db=firebase.firestore();

let games=["UNO","31","Saltacavallo","Fr0c10","Dubito","Las Vegas"];
let selected=[];

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(id==="players")loadPlayers();
if(id==="ranking")loadRanking();
if(id==="palmares")loadPalmares();
if(id==="games")loadGames();
if(id==="tournament")loadSelect();
}

/* GIOCATORI */
async function addPlayer(){
let n=playerName.value;
if(!n)return;
await db.collection("players").add({name:n});
loadPlayers();
}

async function loadPlayers(){
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
html+=`<div class="box">${d.data().name}
<button onclick="editPlayer('${d.id}','${d.data().name}')">✏️</button>
<button onclick="del('players','${d.id}')">❌</button></div>`;
});
playersList.innerHTML=html;
}

async function editPlayer(id,n){
let nuovo=prompt("Nome",n);
if(!nuovo)return;
await db.collection("players").doc(id).update({name:nuovo});
loadPlayers();
}

async function del(col,id){
await db.collection(col).doc(id).delete();
show(col);
}

/* TORNEO */
async function loadSelect(){
selected=[];
let snap=await db.collection("players").get();
let html="";
snap.forEach(d=>{
let n=d.data().name;
html+=`<input type="checkbox" value="${n}" onchange="toggle(this)"> ${n}<br>`;
});
selectPlayers.innerHTML=html;
}

function toggle(e){
if(e.checked)selected.push(e.value);
else selected=selected.filter(p=>p!==e.value);
}

function startGames(){
let html="";
games.forEach(g=>{
html+=`<h3>${g}</h3>`;
selected.forEach(p=>{
html+=`${p}<input id="${g}_${p}" value="0"><br>`;
});
});
html+=`<button onclick="finish()">Fine Torneo</button>`;
gamesArea.innerHTML=html;
}

async function finish(){
let totals={};
selected.forEach(p=>totals[p]=0);

for(let g of games){
for(let p of selected){
let val=parseInt(document.getElementById(g+"_"+p).value)||0;
totals[p]+=val;
await db.collection("gameRanking").add({game:g,player:p,points:val});
}
}

for(let p in totals){
await db.collection("ranking").add({name:p,points:totals[p]});
}

let winner=Object.keys(totals).sort((a,b)=>totals[b]-totals[a])[0];
await db.collection("palmares").add({name:winner});

/* animazione */
let i=0;
let interval=setInterval(()=>{
gamesArea.innerHTML="<h1>"+Math.random().toString(36).substring(2,6)+"</h1>";
i++;
if(i>15){
clearInterval(interval);
gamesArea.innerHTML="<h1>🏆 "+winner+"</h1><button onclick='resetTorneo()'>Nuovo Torneo</button>";
}
},100);
}

function resetTorneo(){
gamesArea.innerHTML="";
show("tournament");
}

/* PALMARES */
async function loadPalmares(){
let snap=await db.collection("palmares").get();
let data={};
snap.forEach(d=>{
let n=d.data().name;
data[n]=(data[n]||0)+1;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} 🏆 ${p[1]}
<button onclick="delName('palmares','${p[0]}')">❌</button></div>`;
});
palmaresList.innerHTML=html;
}

/* CLASSIFICA */
async function loadRanking(){
let snap=await db.collection("ranking").get();
let data={};
snap.forEach(d=>{
let n=d.data().name;
data[n]=(data[n]||0)+d.data().points;
});

let html="";
Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`<div class="box">${p[0]} ${p[1]}
<button onclick="delName('ranking','${p[0]}')">❌</button></div>`;
});
rankingList.innerHTML=html;
}

/* PER GIOCO */
async function loadGames(){
let snap=await db.collection("gameRanking").get();
let data={};

snap.forEach(d=>{
let g=d.data().game;
let p=d.data().player;
let pts=d.data().points;

if(!data[g])data[g]={};
data[g][p]=(data[g][p]||0)+pts;
});

let html="";
for(let g of games){
html+=`<div class="box"><h3>${g}</h3>`;
if(data[g]){
Object.entries(data[g]).sort((a,b)=>b[1]-a[1]).forEach(p=>{
html+=`${p[0]} ${p[1]}
<button onclick="delGame('${g}','${p[0]}')">❌</button><br>`;
});
}
html+="</div>";
}
gamesList.innerHTML=html;
}

/* DELETE PER NOME */
async function delName(col,name){
let snap=await db.collection(col).get();
snap.forEach(async d=>{
if(d.data().name===name) await db.collection(col).doc(d.id).delete();
});
show(col);
}

/* DELETE GAME */
async function delGame(g,p){
let snap=await db.collection("gameRanking").get();
snap.forEach(async d=>{
if(d.data().game===g && d.data().player===p){
await db.collection("gameRanking").doc(d.id).delete();
}
});
loadGames();
}

/* RUOTA */
let options=["UNO","31","Saltacavallo","Fr0c10","Dubito"];
let colors=["red","blue","green","purple","orange"];

function drawWheel(){
let step=360/options.length;
let grad="";
options.forEach((o,i)=>{
grad+=`${colors[i]} ${i*step}deg ${(i+1)*step}deg,`;
});
wheel.style.background=`conic-gradient(${grad.slice(0,-1)})`;
}
drawWheel();

function spin(){
let deg=360*5+Math.random()*360;
wheel.style.transform=`rotate(${deg}deg)`;

setTimeout(()=>{
let index=Math.floor(Math.random()*options.length);
wheelResult.innerHTML="🎯 "+options[index]+" ("+colors[index]+")";
},3000);
}
</script>

</body>
</html>
