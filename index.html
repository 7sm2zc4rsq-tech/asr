<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Del Porcodidio</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Orbitron',sans-serif;
    color:white;
    text-align:center;
    background:url("sfondo.jpg") no-repeat center center fixed;
    background-size:cover;
}

/* SCHERMATE */
.screen{
    display:none;
    min-height:100vh;
}

.active{
    display:block;
}

/* HOME */
.menu-btn{
    width:100%;
    height:33.33vh;

    border:none;

    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(4px);

    font-size:48px;
    font-weight:800;
    letter-spacing:3px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:0.2s;
}

.menu-btn:active{
    transform:scale(0.97);
}

/* GENERALE */
button{
    border:none;
    border-radius:12px;
    padding:12px;
    margin:6px;
    font-family:'Orbitron',sans-serif;
}

input{
    padding:10px;
    border-radius:8px;
    border:none;
    margin:5px;
    width:120px;
}

.box{
    background:rgba(0,0,0,0.6);
    margin:10px;
    padding:12px;
    border-radius:12px;
}

.title{
    font-size:32px;
    margin-top:20px;
}
</style>

</head>

<body>

<!-- SUONI -->

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio> <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<!-- HOME -->

<div id="home" class="screen active">

<button class="menu-btn" style="color:#00ffe5;" onclick="show('tournament')">
🎮 NUOVO TORNEO
</button>

<button class="menu-btn" style="color:#ffd000;" onclick="show('players')">
👤 GIOCATORI
</button>

<button class="menu-btn" style="color:#ff4040;" onclick="show('palmares')">
🏆 PALMARES
</button>

</div>

<!-- GIOCATORI -->

<div id="players" class="screen">

<div class="title">Giocatori</div>

<input id="playerName" placeholder="Nome">

<button onclick="addPlayer()">
Aggiungi
</button>

<div id="playersList"></div>

<button onclick="goHome()">
⬅️ Home
</button>

</div>

<!-- PALMARES -->

<div id="palmares" class="screen">

<div class="title">Palmares</div>

<div id="palmaresList"></div>

<button onclick="goHome()">
⬅️ Home
</button>

</div>

<!-- TORNEO -->

<div id="tournament" class="screen">

<div class="title">Seleziona Giocatori</div>

<div id="selectPlayers"></div>

<button onclick="prepareGames()">
Continua
</button>

<div id="gamesArea"></div>

<button onclick="goHome()">
⬅️ Home
</button>

</div>

<!-- FIREBASE -->

<script type="module">

import { 
initializeApp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBAEAkkHZl7C5oZ0kg7aTYmRwfefo2CP2c",
  authDomain: "torneo-74c5b.firebaseapp.com",
  projectId: "torneo-74c5b",
  storageBucket: "torneo-74c5b.firebasestorage.app",
  messagingSenderId: "937631619179",
  appId: "1:937631619179:web:36be07ea0a2db93368b92e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* GIOCHI */
let games = [
"UNO",
"31",
"Saltacavallo",
"Fr0cio",
"Dubito",
"Las Vegas"
];

let selected = [];

/* SUONI */
function clickSound(){
    let s=document.getElementById("clickSound");
    s.currentTime=0;
    s.play();
}

function winSound(){
    let s=document.getElementById("winSound");
    s.currentTime=0;
    s.play();
}

/* NAV */
function show(id){

    clickSound();

    document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

    document.getElementById(id)
    .classList.add("active");

    if(id==="players") loadPlayers();

    if(id==="palmares") loadPalmares();

    if(id==="tournament") loadSelectPlayers();
}

function goHome(){
    show("home");
}

/* =========================
   GIOCATORI
========================= */

async function addPlayer(){

    clickSound();

    let name=document.getElementById("playerName").value;

    if(!name) return;

    await addDoc(collection(db,"players"),{
        name:name
    });

    document.getElementById("playerName").value="";

    loadPlayers();
}

async function loadPlayers(){

    const snap = await getDocs(collection(db,"players"));

    let html="";

    snap.forEach(d=>{

        html += `
        <div class="box">

            ${d.data().name}

            <button onclick="editPlayer('${d.id}','${d.data().name}')">
            ✏️
            </button>

            <button onclick="deletePlayer('${d.id}')">
            ❌
            </button>

        </div>
        `;
    });

    document.getElementById("playersList").innerHTML=html;
}

async function deletePlayer(id){

    clickSound();

    await deleteDoc(doc(db,"players",id));

    loadPlayers();
}

async function editPlayer(id,current){

    clickSound();

    let nuovo = prompt("Nuovo nome",current);

    if(!nuovo) return;

    await updateDoc(doc(db,"players",id),{
        name:nuovo
    });

    loadPlayers();
}

/* =========================
   SELEZIONE GIOCATORI
========================= */

async function loadSelectPlayers(){

    selected=[];

    const snap = await getDocs(collection(db,"players"));

    let html="";

    snap.forEach(d=>{

        let name=d.data().name;

        html += `
        <div class="box">

            <input 
            type="checkbox" 
            value="${name}"
            onchange="togglePlayer(this)">

            ${name}

        </div>
        `;
    });

    document.getElementById("selectPlayers").innerHTML=html;

    document.getElementById("gamesArea").innerHTML="";
}

function togglePlayer(el){

    if(el.checked){
        selected.push(el.value);
    }else{
        selected = selected.filter(p=>p!==el.value);
    }
}

/* =========================
   PREPARA GIOCHI
========================= */

function prepareGames(){

    clickSound();

    if(selected.length===0){

        alert("Seleziona almeno un giocatore");

        return;
    }

    let area=document.getElementById("gamesArea");

    area.innerHTML="";

    games.forEach(g=>{

        area.innerHTML += `
        <div class="box">
        <h2>${g}</h2>
        </div>
        `;

        selected.forEach(p=>{

            area.innerHTML += `
            <div class="box">

                ${p}

                <input 
                type="number" 
                id="${g}_${p}" 
                value="0">

            </div>
            `;
        });

    });

    area.innerHTML += `
    <button onclick="finishTournament()">
    🏆 Fine Torneo
    </button>
    `;
}

/* =========================
   FINE TORNEO
========================= */

async function finishTournament(){

    clickSound();

    let totals={};

    selected.forEach(p=>{
        totals[p]=0;
    });

    games.forEach(g=>{

        selected.forEach(p=>{

            let val=parseInt(
                document.getElementById(`${g}_${p}`).value
            ) || 0;

            totals[p]+=val;
        });

    });

    let winner = Object.keys(totals)
    .sort((a,b)=>totals[b]-totals[a])[0];

    await addDoc(collection(db,"palmares"),{
        winner:winner,
        points:totals[winner],
        date:new Date().toLocaleDateString()
    });

    winSound();

    setTimeout(()=>{

        alert(
        "🏆 Vincitore: " + winner +
        "\nPunti: " + totals[winner]
        );

        goHome();

    },300);
}

/* =========================
   PALMARES
========================= */

async function loadPalmares(){

    const snap = await getDocs(collection(db,"palmares"));

    let html="";

    snap.forEach(d=>{

        html += `
        <div class="box">

            🏆 ${d.data().winner}
            <br>
            ${d.data().points} pt
            <br>
            ${d.data().date}

            <br><br>

            <button onclick="deletePalmares('${d.id}')">
            ❌ Elimina
            </button>

        </div>
        `;
    });

    document.getElementById("palmaresList").innerHTML=html;
}

async function deletePalmares(id){

    clickSound();

    await deleteDoc(doc(db,"palmares",id));

    loadPalmares();
}

/* GLOBAL */
window.show=show;
window.goHome=goHome;

window.addPlayer=addPlayer;
window.deletePlayer=deletePlayer;
window.editPlayer=editPlayer;

window.togglePlayer=togglePlayer;

window.prepareGames=prepareGames;
window.finishTournament=finishTournament;

window.deletePalmares=deletePalmares;

</script>

</body>
</html>
